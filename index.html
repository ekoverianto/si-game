<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Subsistem Sistem Informasi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#667085;--pri:#3b5bdb;--ok:#2b9348;--bad:#d62839;--bd:#c9d1e3;--chip:#e7ecff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#1a2030;--tx:#e8ecf5;--mut:#98a2b8;--pri:#7c9bff;--ok:#4cc16b;--bad:#ff6b78;--bd:#38425c;--chip:#27304a}}
:root[data-theme="dark"]{--bg:#10141f;--card:#1a2030;--tx:#e8ecf5;--mut:#98a2b8;--pri:#7c9bff;--ok:#4cc16b;--bad:#ff6b78;--bd:#38425c;--chip:#27304a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.35rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mut);font-size:.92rem}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h2{font-size:1rem;margin:0 0 10px;color:var(--mut);font-weight:600}
#target{border:2px dashed var(--pri);min-height:130px;transition:background .15s}
#target.over{background:var(--chip)}
#target .title{font-size:1.15rem;font-weight:700;color:var(--pri);margin-bottom:8px}
.zone{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.chip{background:var(--chip);border:1px solid var(--bd);padding:8px 12px;border-radius:999px;cursor:grab;user-select:none;font-size:.92rem;touch-action:manipulation}
.chip.drag{opacity:.4}
.chip.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.chip.miss{border:2px dashed var(--ok);background:transparent}
.hint{font-size:.82rem;color:var(--mut);margin-top:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--chip);color:var(--tx)}
.row{display:flex;gap:10px;flex-wrap:wrap}
#result{display:none;text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--pri);line-height:1.1}
.legend{font-size:.85rem;color:var(--mut);margin:8px 0 12px;text-align:left}
</style>
</head>
<body>
<main>
  <h1>🧩 Game Subsistem Sistem Informasi</h1>
  <p class="sub">Seret (drag &amp; drop) subsistem yang tepat ke dalam kotak sistem informasi. Di HP, cukup ketuk untuk memindahkan.</p>

  <div class="card" id="target">
    <div class="title" id="sysName"></div>
    <div class="zone" id="dropZone"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="card">
    <h2>Pilihan Subsistem</h2>
    <div class="zone" id="pool"></div>
  </div>

  <div class="row" id="actions">
    <button id="btnDone">Selesai &amp; Lihat Skor</button>
    <button class="sec" id="btnReset">Acak Ulang</button>
  </div>

  <div class="card" id="result">
    <h2>Skor Akhir</h2>
    <div class="score" id="score"></div>
    <div id="detail"></div>
    <div class="legend">🟩 Benar &nbsp; 🟥 Salah (bukan subsistem ini) &nbsp; ⬚ Terlewat</div>
    <div class="zone" id="review"></div>
    <br><button id="btnAgain">Main Lagi (Sistem Baru)</button>
  </div>
</main>

<script>
const DATA = [
 {n:"Sistem Informasi Akademik", s:["Pendaftaran Mahasiswa Baru","Kartu Rencana Studi (KRS)","Penjadwalan Kuliah","Penilaian & KHS","Presensi Kuliah","Yudisium & Wisuda"]},
 {n:"Sistem Informasi Personalia", s:["Rekrutmen & Seleksi","Absensi Karyawan","Penggajian (Payroll)","Pelatihan & Pengembangan","Penilaian Kinerja","Cuti & Perizinan"]},
 {n:"Sistem Informasi Produksi", s:["Perencanaan Produksi","Pengendalian Kualitas","Penjadwalan Mesin","Manajemen Bahan Baku","Pemeliharaan Mesin","Pelaporan Hasil Produksi"]},
 {n:"Sistem Informasi Keuangan", s:["Buku Besar","Hutang Usaha","Piutang Usaha","Anggaran (Budgeting)","Kas & Bank","Laporan Keuangan"]},
 {n:"Sistem Informasi Pemasaran", s:["Riset Pasar","Manajemen Promosi","Analisis Penjualan","Manajemen Pelanggan (CRM)","Penetapan Harga","Distribusi Produk"]},
 {n:"Sistem Informasi Perpustakaan", s:["Katalog Buku","Peminjaman Buku","Pengembalian & Denda","Keanggotaan","Pengadaan Buku","Inventarisasi Koleksi"]},
 {n:"Sistem Informasi Rumah Sakit", s:["Pendaftaran Pasien","Rekam Medis","Farmasi & Obat","Rawat Inap","Laboratorium","Penagihan Pasien"]},
 {n:"Sistem Informasi Perhotelan", s:["Reservasi Kamar","Check-in & Check-out","Housekeeping","Layanan Restoran","Penagihan Tamu","Manajemen Tarif Kamar"]},
 {n:"Sistem Informasi Logistik", s:["Manajemen Gudang","Pengiriman Barang","Pelacakan Armada","Pengadaan Barang","Manajemen Stok","Rute & Penjadwalan Kirim"]},
 {n:"Sistem Informasi Perbankan", s:["Layanan Tabungan","Pengajuan Kredit","Layanan Teller","Mobile Banking","Deposito","Manajemen Risiko Kredit"]}
];

const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let cur=-1, correct=[], dragged=null, finished=false;

function newGame(){
  let i; do{i=Math.floor(Math.random()*DATA.length)}while(i===cur&&DATA.length>1);
  cur=i; finished=false;
  const sys=DATA[i];
  correct=sys.s;
  const others=shuffle(DATA.filter((_,k)=>k!==i).flatMap(d=>d.s)).slice(0,correct.length);
  $("sysName").textContent=sys.n;
  $("hint").textContent="Ada "+correct.length+" subsistem yang benar, tersembunyi di antara "+(correct.length*2)+" pilihan. Salah tempat = skor berkurang.";
  $("dropZone").innerHTML=""; $("pool").innerHTML="";
  shuffle([...correct,...others]).forEach(t=>$("pool").appendChild(chip(t)));
  $("result").style.display="none"; $("actions").style.display="flex";
}
function chip(t){
  const c=document.createElement("div");
  c.className="chip"; c.textContent=t; c.draggable=true;
  c.addEventListener("dragstart",e=>{if(finished)return e.preventDefault();dragged=c;c.classList.add("drag");e.dataTransfer.setData("text/plain",t)});
  c.addEventListener("dragend",()=>{c.classList.remove("drag");dragged=null});
  c.addEventListener("click",()=>{if(finished)return;(c.parentElement===$("pool")?$("dropZone"):$("pool")).appendChild(c)});
  return c;
}
function zone(el){
  el.addEventListener("dragover",e=>{e.preventDefault();$("target").classList.toggle("over",el===$("dropZone"))});
  el.addEventListener("dragleave",()=>$("target").classList.remove("over"));
  el.addEventListener("drop",e=>{e.preventDefault();$("target").classList.remove("over");if(dragged&&!finished)el.appendChild(dragged)});
}
zone($("dropZone")); zone($("pool")); zone($("target"));
$("target").addEventListener("drop",e=>{e.preventDefault();$("target").classList.remove("over");if(dragged&&!finished)$("dropZone").appendChild(dragged)});

$("btnDone").onclick=()=>{
  finished=true;
  const placed=[...$("dropZone").children].map(c=>c.textContent);
  const ok=placed.filter(t=>correct.includes(t));
  const bad=placed.filter(t=>!correct.includes(t));
  const miss=correct.filter(t=>!placed.includes(t));
  const sc=Math.max(0,Math.round((ok.length-bad.length)/correct.length*100));
  $("score").textContent=sc;
  $("detail").innerHTML="Benar: <b>"+ok.length+"</b> · Salah: <b>"+bad.length+"</b> · Terlewat: <b>"+miss.length+"</b> dari "+correct.length+" subsistem<br>"+
    (sc===100?"🎉 Sempurna!":sc>=70?"👍 Bagus sekali!":sc>=40?"🙂 Lumayan, coba lagi!":"📚 Ayo belajar lagi!");
  const rv=$("review"); rv.innerHTML="";
  ok.forEach(t=>add(rv,t,"ok")); bad.forEach(t=>add(rv,t,"bad")); miss.forEach(t=>add(rv,t,"miss"));
  $("result").style.display="block"; $("actions").style.display="none";
  $("result").scrollIntoView({behavior:"smooth"});
};
function add(p,t,cls){const d=document.createElement("div");d.className="chip "+cls;d.textContent=t;p.appendChild(d)}
$("btnReset").onclick=()=>{cur=-1;newGame()};
$("btnAgain").onclick=newGame;
newGame();
</script>
</body>
</html>
